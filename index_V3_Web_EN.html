    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>

        @font-face {
            font-family: "Neue Haas Grotesk";
            src: url("fonts/NHaasGroteskTXPro-Rg.woff2") format("woff2");
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: "Neue Haas Grotesk", Arial, sans-serif;
        }

        svg text {
            font-family: "Neue Haas Grotesk", Arial, sans-serif;
        }

        .layer {
            cursor: pointer;
            opacity: 0.9;
        }

        .layer:hover {
            opacity: 1;
        }

        .back-button {
            cursor: pointer;
            color: #0077cc;
            margin-bottom: 10px;
        }

        .back-button:hover {
            text-decoration: underline;
        }

        .description {
            margin-bottom: 10px;
            color: #444;
        }

        .grid line {
            stroke: #e5e7eb;
            stroke-opacity: 1;
            shape-rendering: crispEdges;
        }

        .grid path {
            display: none;
        }

        #controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 8px 16px;
            margin-top: 12px;
            padding: 8px;
            grid-auto-rows: minmax(10px, auto);
            min-height: 150px;
            background-color: #f0f0f0;
        }

        #controls label {
            display: flex;
            align-items: flex-start;
            white-space: normal;
            line-height: 1.2;
            font-size: 12px;
        }

        #breadcrumb {
            margin-top: 20px;
            margin-bottom: 8px;
            font-size: 13px;
            color: #0077cc;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
        }

        #breadcrumb span {
            cursor: pointer;
        }

        #breadcrumb span:hover {
            text-decoration: underline;
        }

        #breadcrumb .current {
            color: #333;
            font-weight: 600;
            cursor: default;
        }

        #breadcrumb .current:hover {
            text-decoration: none;
        }

        #breadcrumb .sep {
            color: #999;
            cursor: default;
        }

        #breadcrumb .sep:hover {
            text-decoration: none;
        }

        #tooltip {
            position:fixed;
            background:#f0f0f0;
            padding:10px;
            font-size:12px;
            pointer-events:none;
            opacity:0;
            z-index:1000;
        }

        #defbox {
            margin-top: 10px;
            min-height: 36px;
            background: #f0f0f0;
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 13px;
            display: none;
        }


        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            #controls {
                gap: 6px 10px;
                grid-template-columns: 1fr;
            }

            #controls label {
                line-height: 1.3;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <div id="controls"></div>
    <div id="breadcrumb"></div>
    <div id="chart"></div>
    <div id="tooltip"></div>
    <div id="defbox"></div>

    <script>
        // ----------------------
        // DATA
        // ----------------------

        let rootData = [];
        let currentNodes = [];
        let history = [];
        let historyNames = [];

        function clone(obj) {
            return JSON.parse(JSON.stringify(obj));
        }

        d3.json("https://raw.githack.com/SwissAcademyOfEngineeringSciences/FigCyberCrime/refs/heads/main/data_cyber_crime.json").then(data => {
            //d3.text("data_cyber_crime.txt").then(data => {
            //const json = JSON.parse(data);
            //rootData = clone(json);
            rootData = clone(data);
            currentNodes = rootData[0].children;
            historyNames.push(rootData[0].name_EN);
            update(currentNodes);
        });

        // ----------------------
        // SETUP
        // ----------------------

        const margin = { top: 10, right: 16, bottom: 30, left: 55 };

        const palette = d3.quantize(
            d3.interpolateRgbBasis(["#000731", "#0075bf", "#02b2ab"]),
            12
        );

        const svgEl = d3.select("#chart")
            .append("svg")
            .attr("width", "100%")
            .attr("preserveAspectRatio", "xMinYMin meet");

        const g = svgEl.append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        svgEl.append("defs").html(`
            <pattern id="diagonalHatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
                <line x1="0" y1="0" x2="0" y2="6" stroke="rgba(255,255,255,0.4)" stroke-width="0.75"/>
            </pattern>
        `);

        const background = g.append("rect").attr("fill", "transparent");

        const xAxisG = g.append("g");
        const yAxisG = g.append("g");

        const xGridG = g.append("g").attr("class", "grid");
        const yGridG = g.append("g").attr("class", "grid");

        // ----------------------
        // HELPERS
        // ----------------------

        function getLeafNodes(nodes) {
            return nodes.filter(n => n.values);
        }

        function findNodeByName(nodes, name) {
            return nodes.find(n => n.name_EN === name);
        }

        function buildLevelData(nodes) {
            const leaves = getLeafNodes(nodes);
            if (!leaves.length) return [];

            const dates = leaves[0].values.map(d => d.date);

            return dates.map(date => {
                const row = { date: new Date(date, 0, 1) };
                leaves.forEach(n => {
                    row[n.name_EN] = n.values.find(v => v.date === date)?.value ?? 0;
                });
                return row;
            });
        }

        function hideTooltip() {
            d3.select("#tooltip").style("opacity", 0);
        }

        function getColorScale(keys) {
            const n = keys.length;
            const m = palette.length;

            return d3.scaleOrdinal()
                .domain(keys)
                .range(
                    keys.map((_, i) => {
                        const index = Math.round(i * (m - 1) / Math.max(1, n - 1));
                        return palette[index];
                    })
                );
        }

        // ----------------------
        // BREADCRUMB
        // ----------------------

        function renderBreadcrumb() {
            const bc = d3.select("#breadcrumb");
            bc.html("");

            bc.append("span")
                .attr("class", "breadcrumb-title")
                .style("color", "#333")
                .style("font-weight", "500")
                .text("Navigation: ")

            historyNames.forEach((name, i) => {
                if (i > 0) {
                    bc.append("span")
                        .attr("class", "sep")
                        .text("›");
                }

                if (i < historyNames.length - 1) {
                    bc.append("span")
                        .text(name)
                        .on("click", () => {
                            while (historyNames.length - 1 > i) {
                                historyNames.pop();
                                if (history.length) {
                                    currentNodes = history.pop();
                                }
                            }
                            update(currentNodes);
                        });
                } else {
                    bc.append("span")
                        .attr("class", "current")
                        .text(name);
                }
            });
        }

        // ----------------------
        // BACK
        // ----------------------

        function goBack() {
            if (history.length) {
                currentNodes = history.pop();
                if (historyNames.length > 1) historyNames.pop();
                update(currentNodes);
            }
        }

        // ----------------------
        // CHECKBOX FILTERING
        // ----------------------

        let activeKeys = new Set();

        function renderControls(keys, color) {
            const container = d3.select("#controls");

            const items = container.selectAll("label")
                .data(keys, d => d);

            items.exit().remove();

            const enter = items.enter()
                .append("label")
                .style("cursor", "pointer")
                .style("user-select", "none")
                .style("font-size", "13px")
                .style("color", "black");

            enter.append("input")
                .attr("type", "checkbox")
                .style("display", "none")
                .on("change", function (event, key) {
                    if (this.checked) {
                        activeKeys.add(key);
                    } else {
                        activeKeys.delete(key);
                    }
                    update(currentNodes, false, false);
                });

            enter.append("span")
                .attr("class", "custom-box")
                .style("display", "inline-block")
                .style("width", "12px")
                .style("height", "12px")
                .style("border-radius", "2px")
                .style("margin-right", "5px")
                .style("flex-shrink", "0");

            enter.append("span")
                .attr("class", "label-text");

            const merged = enter.merge(items);

            merged.select("input")
                .property("checked", d => activeKeys.has(d));

            merged.select(".custom-box")
                .style("border", d => `2px solid ${color(d)}`)
                .style("background-color", d => activeKeys.has(d) ? color(d) : "white");

            merged.select(".label-text")
                .text(d => d)
                .style("color", "black");
        }

        // ----------------------
        // MAIN UPDATE
        // ----------------------

        function update(nodes, animate = true, syncKeys = true) {
            renderBreadcrumb();

            const W = document.getElementById("chart").clientWidth || 600;
            const width = W - margin.left - margin.right;

            // Mobile detection
            const isMobile = W < 600;

            // Verhältnis: Desktop 2:1, Mobile 3:4
            const H = isMobile
                ? Math.round(width * (4 / 3))  // 3:4 (hoch)
                : Math.round(width * 0.5);     // 2:1 (breit)

            const height = H - margin.top - margin.bottom;

            svgEl.attr("viewBox", `0 0 ${W} ${H}`);
            background.attr("width", width).attr("height", height);
            xAxisG.attr("transform", `translate(0,${height})`);

            const x = d3.scaleTime().range([0, width]);
            const y = d3.scaleLinear().range([height, 0]);

            const area = d3.area()
                .x(d => x(d.data.date))
                .y0(d => y(d[0]))
                .y1(d => y(d[1]))
                .curve(d3.curveMonotoneX);

            const chartData = buildLevelData(nodes);
            if (!chartData.length) return;

            const keys = nodes.map(d => d.name_EN);

            const totals = new Map();
            keys.forEach(k => {
                totals.set(k, d3.sum(chartData, d => d[k]));
            });

            const sortedKeys = keys
                .slice()
                .sort((a, b) => totals.get(b) - totals.get(a));

            if (syncKeys) {
                keys.forEach(k => activeKeys.add(k));
                [...activeKeys].forEach(k => {
                    if (!keys.includes(k)) activeKeys.delete(k);
                });
            }

            const visibleKeys = sortedKeys.filter(k => activeKeys.has(k));

            x.domain(d3.extent(chartData, d => d.date));

            const yMax = d3.max(chartData, d =>
                d3.sum(visibleKeys, k => d[k])
            );
            y.domain([0, yMax * 1.02]).nice();

            const color = getColorScale(sortedKeys);
            const stack = d3.stack().keys(visibleKeys);
            const series = stack(chartData);

            renderControls(keys, color);

            // ----------------------
            // LAYERS
            // ----------------------

            const layers = g.selectAll(".layer")
                .data(series, d => d.key);

            layers.exit().remove();

            const layersEnter = layers.enter()
                .append("path")
                .attr("class", "layer")
                .attr("fill", d => color(d.key))
                .attr("d", area)
                .style("cursor", d => findNodeByName(nodes, d.key)?.children ? "pointer" : "default")
                .on("click", (event, d) => {
                    hideTooltip();
                    const child = findNodeByName(nodes, d.key);
                    if (child?.children) {
                        history.push(clone(nodes));
                        historyNames.push(child.name_EN);
                        currentNodes = child.children;
                        update(currentNodes);
                    }
                })
                .on("mousemove", (event, d) => {
                    const node = findNodeByName(nodes, d.key);
                    const values = node?.values ?? [];
                    const valueRows = values
                        .sort((a, b) => a.date - b.date)
                        .map(v => `${v.date}: ${v.value.toLocaleString("de-CH")}`)
                        .join("<br/>");

                    const tooltip = d3.select("#tooltip")
                        .style("opacity", 1)
                        .html(`<strong>${node?.name_EN ?? d.key}</strong><br/>${valueRows}`);

                    const ttNode = tooltip.node();
                    const bw = window.innerWidth;
                    const bh = window.innerHeight;
                    let tx = event.clientX + 10;
                    let ty = event.clientY + 10;
                    const tw = ttNode.offsetWidth;
                    const th = ttNode.offsetHeight;

                    if (tx + tw > bw - 8) tx = bw - tw - 8;
                    if (ty + th > bh - 8) ty = event.clientY - th - 10;
                    if (tx < 4) tx = 4;
                    if (ty < 4) ty = 4;

                    tooltip
                        .style("left", tx + "px")
                        .style("top", ty + "px");

                    const def = node?.definition_en ?? node?.definition_en ?? "";
                    d3.select("#defbox")
                        .style("display", def ? "block" : "none")
                        .html(`<strong>Definition ${node?.name_EN ?? d.key}:</strong><br/> ${def}`);
                })
                .on("mouseout", () => {
                    d3.select("#tooltip").style("opacity", 0);
                    d3.select("#defbox").style("display", "none");
                });

            layersEnter.merge(layers)
                .attr("fill", d => color(d.key))
                .style("cursor", d =>
                    findNodeByName(nodes, d.key)?.children ? "pointer" : "default"
                )
                .style("opacity", 0.75)
                .transition()
                .duration(animate ? 750 : 0)
                .ease(d3.easeCubicInOut)
                .attr("d", area);

            // ----------------------
            // HATCH
            // ----------------------

            const hatch = g.selectAll(".hatch")
                .data(
                    series.filter(d => findNodeByName(nodes, d.key)?.children),
                    d => d.key
                );

            hatch.exit().remove();

            hatch.enter()
                .append("path")
                .attr("class", "hatch")
                .attr("fill", "url(#diagonalHatch)")
                .attr("pointer-events", "none")
                .merge(hatch)
                .attr("d", area);

            // ----------------------
            // AXES
            // ----------------------

            xAxisG.transition().call(d3.axisBottom(x).ticks(3));
            yAxisG.transition().call(
                d3.axisLeft(y)
                    .tickFormat(d => d3.format(",")(d).replace(/,/g, "'"))
            );

            xAxisG.selectAll("text").style("font-size", "13px");
            yAxisG.selectAll("text").style("font-size", "13px");

            xGridG
                .attr("transform", `translate(0,${height})`)
                .call(
                    d3.axisBottom(x)
                        .ticks(3)
                        .tickSize(-height)
                        .tickFormat("")
                );

            yGridG
                .call(
                    d3.axisLeft(y)
                        .tickSize(-width)
                        .tickFormat("")
                );

            // ----------------------
            // BACKGROUND CLICK
            // ----------------------

            background
                .on("click", goBack)
                .style("pointer-events", history.length ? "all" : "none");
        }

        const ro = new ResizeObserver(() => update(currentNodes, false, false));
        ro.observe(document.getElementById("chart"));
    </script>

</body>
